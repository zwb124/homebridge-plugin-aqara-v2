name: Homebridge v2 compatibility

on:
  push:
    branches:
      - homebridge-v2
  pull_request:
    branches:
      - homebridge-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
