name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org/
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify packed UI server is ESM
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$(mktemp -d)"
          npm pack --pack-destination "$PACK_DIR"
          mkdir "$PACK_DIR/unpacked"
          tar -xzf "$PACK_DIR"/*.tgz -C "$PACK_DIR/unpacked"
          SERVER="$PACK_DIR/unpacked/package/homebridge-ui/server.js"
          test -f "$SERVER"
          node --check "$SERVER"
          grep -Eq "from ['\"]@homebridge/plugin-ui-utils['\"]" "$SERVER"
          grep -Eq "from ['\"]\.\./dist/api/index\.js['\"]" "$SERVER"
          if grep -Eq 'require[[:space:]]*\(' "$SERVER"; then
            echo "Packed UI server still contains CommonJS require()"
            exit 1
          fi
      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
